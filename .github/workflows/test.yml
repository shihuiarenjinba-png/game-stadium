name: Game simulation tests
on:
  push:
    branches: [main, feature/ekiden-manager-mvp, feature/paid-joint-practice-20261019, feature/pre-codex-handoff-gates-20261019]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
