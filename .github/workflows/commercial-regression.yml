name: Ekiden Manager commercial regression
on:
  push:
    branches: ["feature/commercial-coach-ux-20261018"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine, GUI source and save recovery tests
        run: npm test
